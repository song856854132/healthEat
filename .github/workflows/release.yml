name: release

on:
  push:
    tags: ["v*"]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  deployments: write

jobs:
  gate:
    name: secrets present and tag on main?
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: check
        env:
          TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then echo "::error::VERCEL_TOKEN not set; cannot release"; exit 1; fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::tag $GITHUB_REF_NAME points at $GITHUB_SHA, which is not on main; releases are cut from main only"; exit 1
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

  api:
    needs: gate
    uses: ./.github/workflows/_vercel-deploy.yml
    with:
      app: api
      environment: production
      gh_environment: production-api
    secrets:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_API }}

  web:
    needs: [gate, api]
    uses: ./.github/workflows/_vercel-deploy.yml
    with:
      app: web
      environment: production
      # Production API domain of the healtheat-api project (also set in the web project's
      # production env; passing it explicitly keeps the release deterministic).
      api_origin: https://healtheat-api.vercel.app
      gh_environment: production
    secrets:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_WEB }}

  smoke-and-release:
    needs: [api, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: smoke
        run: |
          set -e
          # A misconfigured production function keeps /api/health at 200 on purpose (readable cause), so
          # the gate must look past ok:true: a real session secret and a live connection to healtheat_prod.
          curl -fsS "${{ needs.api.outputs.url }}/api/health" | tee /dev/stderr | grep -q '"secrets":"ok"'
          curl -fsS "${{ needs.api.outputs.url }}/api/health/db" | tee /dev/stderr | grep -q '"db":"connected","dbName":"healtheat_prod"'
          curl -fsS "${{ needs.web.outputs.url }}/api/health" | grep -q '"ok":true'
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          notes=$(awk -v tag="${tag#v}" '/^## /{p = index($0, tag) > 0} p' CHANGELOG.md)
          gh release create "$tag" --title "$tag" --notes "${notes:-Release $tag}" --generate-notes || gh release view "$tag"
