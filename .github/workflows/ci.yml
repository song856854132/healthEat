name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: typecheck, lint, unit and API tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      # mongodb-memory-server downloads a ~100 MB MongoDB binary on first use (~10 s on the runner).
      # An actions/cache step would save that; its `key:` value must start with a `${{ ... }}`
      # expression so the pregate secret scan does not read it as a credential. Tracked in TODOS.md
      # ("CI: cache the mongodb-memory-server binary").
      - run: npm ci
      - run: npm run build:shared
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format
      - run: npx vitest run
