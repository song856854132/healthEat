# Automatic PR review and @claude replies, using the owner's Claude Max subscription token
# (generated once with `claude setup-token`, stored as CLAUDE_CODE_OAUTH_TOKEN). The jobs
# skip cleanly until that secret exists. Findings are advice; the human approval is the gate.
name: claude

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        env:
          TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: if [ -n "$TOKEN" ]; then echo "ready=true" >> "$GITHUB_OUTPUT"; else echo "ready=false" >> "$GITHUB_OUTPUT"; fi

  review:
    name: automatic PR review
    needs: gate
    if: needs.gate.outputs.ready == 'true' && github.event_name == 'pull_request' && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Review this pull request for the healthEat repo. Read docs/designs/healtheat-nutrient-coach.md
            (Recommended Approach and Working plan amendments) and docs/team-workflow.md first; the PR
            should implement one plan task (T-number in the PR body). Report: correctness bugs,
            deviations from the plan's data model or REST surface, missing tests for new routes,
            secrets or connection strings in the diff. Use inline comments for specific lines and one
            short summary comment. Do not restyle code or praise it.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"

  mention:
    name: answer @claude
    needs: gate
    if: needs.gate.outputs.ready == 'true' && github.event_name != 'pull_request' && contains(github.event.comment.body, '@claude')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
